</style>
<script>
// ══════════════════════════════════════════════════════════════
// 🎲 隨機配餐工具：從庫存物資中挑選品項，自動排出不重複、不過期的每日菜單
// ══════════════════════════════════════════════════════════════
(function(){
  'use strict';
  const LS_KEY='cat_feed_planner_v1';
  // 目前只需要「罐頭」，先把分類篩選 UI 藏起來，但邏輯保留，
  // 未來如果要開放其他分類（飼料/貓砂...），把這裡改成 true 就會顯示篩選列。
  const SHOW_CATEGORY_FILTER=false;
  const CATS=[
    {value:'all',label:'🗂️ 全部'},
    {value:'飼料',label:'🥩 飼料'},
    {value:'罐頭',label:'🥫 罐頭'},
    {value:'點心',label:'🍬 點心'},
    {value:'貓砂',label:'⏳ 貓砂'},
    {value:'保健/醫療',label:'💊 保健/醫療'},
    {value:'其他',label:'🎈 其他'}
  ];

  let state={
    filterCat:'罐頭',
    selectedIds:{},          // {id:true}
    cfg:{},                  // {id:{grams,days}}
    cooldown:3,
    startDate:todayStr(),
    horizonDays:14
  };
  let lastSchedule=null;
  let lastTotalSupplyDays=0;

  function todayStr(){
    const d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function loadState(){
    try{
      const raw=localStorage.getItem(LS_KEY);
      if(raw){ const s=JSON.parse(raw); state=Object.assign(state,s); }
    }catch(e){}
    if(!state.startDate || state.startDate<todayStr()) state.startDate=todayStr();
    if(!SHOW_CATEGORY_FILTER) state.filterCat='罐頭'; // 篩選列隱藏時，固定只看罐頭
  }
  function saveState(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  }
  function parseGrams(name){
    const m=String(name||'').match(/(\d+(?:\.\d+)?)\s*g(?![a-zA-Z])/i);
    return m ? parseFloat(m[1]) : '';
  }
  // 剩餘可用庫存：count 模式（有明確逐次打勾紀錄）要扣掉已經吃掉的次數(logs.length)，
  // 避免把「原始購入總量」誤當成「目前剩餘量」拿去排菜單。
  function remainingUnits(it){
    const total=(it.total&&it.total>0)?it.total:1;
    const used=(it.mode==='count'&&Array.isArray(it.logs))?it.logs.length:0;
    return Math.max(0, total-used);
  }
  function loadInventory(){
    let db=[];
    try{ db=JSON.parse(localStorage.getItem('cat_v12_5')||'[]'); }catch(e){}
    const today=todayStr();
    return db.filter(it=> it.status!=='done' && (!it.expiry || it.expiry>=today));
  }

  const NAV_BTN_ACTIVE_CLASS='w-full px-4 py-3 text-left font-bold text-sm rounded-2xl flex items-center gap-2 transition-all cursor-pointer bg-primary text-white shadow-md shadow-primary/20 glow-primary';
  const NAV_BTN_INACTIVE_CLASS='w-full px-4 py-3 text-left font-bold text-sm rounded-2xl flex items-center gap-2 transition-all cursor-pointer text-zinc-400 hover:text-zinc-150 hover:bg-zinc-800/40';

  function ensurePage(){
    if(document.getElementById('fp-page')) return;
    const main=document.querySelector('main');
    if(!main||!main.parentElement) return;
    const page=document.createElement('div');
    page.id='fp-page';
    // 沿用 main 本身的排版 class，讓這個頁面跟其他頁籤佔的位置、留白完全一致
    page.className=main.className+' flex-col';
    page.innerHTML =
      '<div id="fp-head">'+
        '<div><h3>🎲 隨機配餐</h3><p>挑選要輪替的物資，自動排出不重複、不過期的每日菜單</p></div>'+
      '</div>'+
      '<div id="fp-body"></div>';
    main.parentElement.insertBefore(page, main.nextSibling);
  }

  let overriddenRealBtn=null; // 記住開啟時被我們暫時取消反白的「真正頁籤」按鈕，關閉時要還原

  function setNavBtnActive(active){
    const btn=document.getElementById('fp-nav-btn');
    if(btn) btn.className = active ? NAV_BTN_ACTIVE_CLASS : NAV_BTN_INACTIVE_CLASS;
  }

  function openPanel(){
    ensurePage();
    const main=document.querySelector('main');
    const page=document.getElementById('fp-page');
    if(!page) return;
    if(page.classList.contains('open')){ closePanel(); return; } // 再點一次＝切回原本頁籤
    if(main) main.style.display='none';
    loadState();
    renderBody();
    page.classList.add('open');
    setNavBtnActive(true);
    // React 完全不知道我們切換了畫面，它記憶中「選中的頁籤」不會變，
    // 所以要手動把目前顯示反白的那個真正頁籤按鈕改成未選中樣式，
    // 避免畫面上同時有兩個頁籤看起來是選中的。
    const nav=document.querySelector('aside nav');
    overriddenRealBtn = nav
      ? Array.from(nav.querySelectorAll('button')).find(b=>b.id!=='fp-nav-btn' && b.className.indexOf('bg-primary')!==-1)
      : null;
    if(overriddenRealBtn) overriddenRealBtn.className=NAV_BTN_INACTIVE_CLASS;
  }
  function closePanel(){
    const page=document.getElementById('fp-page');
    const main=document.querySelector('main');
    if(page) page.classList.remove('open');
    if(main) main.style.display='';
    setNavBtnActive(false);
    const resultOv=document.getElementById('fp-result-overlay');
    if(resultOv) resultOv.classList.remove('open');
    // 還原剛才被暫時取消反白的真正頁籤（除非使用者是點擊「別的」真正頁籤離開，
    // 那種情況 React 自己就會正確反白新點的那個，這裡還原舊的也不會有影響）
    if(overriddenRealBtn){ overriddenRealBtn.className=NAV_BTN_ACTIVE_CLASS; overriddenRealBtn=null; }
  }
  // 點擊其他任何一個真正的頁籤按鈕時，自動切回去（讓這個功能表現得像分頁，而不是彈出視窗）
  function watchRealTabClicks(){
    const nav=document.querySelector('aside nav');
    if(!nav||nav._fpWatched) return;
    nav._fpWatched=true;
    nav.addEventListener('click', function(e){
      const btn=e.target.closest('button');
      if(btn && btn.id!=='fp-nav-btn'){
        const page=document.getElementById('fp-page');
        if(page && page.classList.contains('open')) closePanel();
      }
    });
  }

  function renderBody(){
    const body=document.getElementById('fp-body');
    if(!body) return;
    const inv=loadInventory();
    const catChips=CATS.map(c=>
      '<button type="button" class="fp-chip'+(state.filterCat===c.value?' active':'')+'" data-cat="'+c.value+'">'+c.label+'</button>'
    ).join('');
    const filtered = (state.filterCat==='all' ? inv : inv.filter(it=>it.category===state.filterCat))
      .slice()
      .sort((a,b)=> (a.expiry||'9999-99-99').localeCompare(b.expiry||'9999-99-99')); // 快到期排上面

    let itemsHtml;
    if(filtered.length===0){
      itemsHtml='<div class="fp-item-empty">這個分類目前沒有「使用中/庫存中」且尚未過期的物資喔</div>';
    }else{
      itemsHtml = filtered.map(it=>{
        const checked = !!state.selectedIds[it.id];
        const cfg = state.cfg[it.id] || {};
        const gramsPerUnit = cfg.gramsPerUnit!==undefined ? cfg.gramsPerUnit : parseGrams(it.name);
        const daysPerUnit = cfg.daysPerUnit!==undefined ? cfg.daysPerUnit : '';
        const unitLabel = it.specUnit || '罐';
        const units = remainingUnits(it);
        const expiryWarn = it.expiry ? (it.expiry <= addDaysStr(todayStr(),14)) : false;
        const usedNote = (it.mode==='count' && it.logs && it.logs.length>0) ? '（已吃 '+it.logs.length+unitLabel+'）' : '';
        const metaTxt = '剩 '+units+unitLabel+usedNote + (it.expiry ? '　到期 '+it.expiry : '　無期限');
        return (
          '<div class="fp-item-row'+(checked?' checked':'')+'" data-id="'+it.id+'">'+
            '<label class="fp-item-top">'+
              '<input type="checkbox" data-role="fp-check" data-id="'+it.id+'" '+(checked?'checked':'')+' />'+
              '<span class="fp-item-name">'+escapeHtml(it.name)+'</span>'+
              '<span class="fp-item-meta'+(expiryWarn?' warn':'')+'">'+escapeHtml(metaTxt)+'</span>'+
            '</label>'+
            '<div class="fp-item-cfg">'+
              '<div><label>每'+escapeHtml(unitLabel)+' 幾 g</label><input type="number" min="0" step="1" data-role="fp-grams" data-id="'+it.id+'" value="'+gramsPerUnit+'" /></div>'+
              '<div><label>1'+escapeHtml(unitLabel)+' 連續吃幾天</label><input type="number" min="0" step="1" data-role="fp-days" data-id="'+it.id+'" value="'+daysPerUnit+'" /></div>'+
              '<div class="fp-item-total-hint" data-id="'+it.id+'">'+totalHintText(units,unitLabel,daysPerUnit)+'</div>'+
            '</div>'+
          '</div>'
        );
      }).join('');
    }

    const selCount=Object.keys(state.selectedIds).length;
    const allChecked = filtered.length>0 && filtered.every(it=>state.selectedIds[it.id]);

    body.innerHTML =
      '<div id="fp-layout">'+
        '<div id="fp-col-left">'+
          (SHOW_CATEGORY_FILTER ?
          '<div class="fp-sec">'+
            '<p class="fp-sec-title">📂 分類篩選</p>'+
            '<div class="fp-chip-row">'+catChips+'</div>'+
          '</div>' : '')+
          '<div class="fp-sec">'+
            '<div class="fp-sec-title-row">'+
              '<p class="fp-sec-title">✅ 選擇要輪替的物資</p>'+
              '<button type="button" class="fp-select-btn" id="fp-select-toggle">'+(allChecked?'取消全選':'全選')+'</button>'+
              '<span class="fp-select-count" id="fp-select-count">已選 '+selCount+' 項</span>'+
            '</div>'+
            '<div class="fp-item-list">'+itemsHtml+'</div>'+
            '<p class="fp-hint">已依到期日排序，快到期的排在最上面。勾選後可調整「每'+ '罐/包/入' +' 幾 g」與「1罐連續吃幾天」（g 數已嘗試從品名自動抓取；天數請自行填寫，工具會用目前剩餘庫存自動換算總天數，已經吃掉的部分會自動扣除）。</p>'+
          '</div>'+
        '</div>'+
        '<div id="fp-col-right">'+
          '<div class="fp-sec">'+
            '<p class="fp-sec-title">⚙️ 排程設定</p>'+
            '<div class="fp-settings-grid">'+
              '<div class="fp-field"><label>最少間隔幾天</label><input type="number" min="0" step="1" id="fp-cooldown" value="'+state.cooldown+'" /></div>'+
              '<div class="fp-field"><label>從哪天開始</label><input type="date" id="fp-startdate" value="'+state.startDate+'" /></div>'+
              '<div class="fp-field"><label>要排幾天</label><input type="number" min="1" max="730" step="1" id="fp-horizon" value="'+state.horizonDays+'" /></div>'+
            '</div>'+
            '<p class="fp-hint">同一罐開封後會「連續吃完」才換下一罐（不會拆成不連續的幾天）。「最少間隔幾天」是指這罐吃完後，至少要隔幾天才會再輪到同一項物資（例如設 3，代表罐頭A吃完後至少要等 3 天才會再輪到）。</p>'+
          '</div>'+
          '<button type="button" id="fp-generate-btn">🎲 產生隨機菜單</button>'+
          (lastSchedule ? '<div id="fp-result-hint-row"><button type="button" id="fp-view-result-btn">📋 查看上次產生的菜單</button></div>' : '')+
        '</div>'+
      '</div>';

    // 事件綁定
    body.querySelectorAll('.fp-chip').forEach(btn=>{
      btn.addEventListener('click', function(){
        state.filterCat=btn.getAttribute('data-cat');
        saveState();
        renderBody();
      });
    });
    body.querySelectorAll('[data-role="fp-check"]').forEach(cb=>{
      cb.addEventListener('change', function(){
        const id=cb.getAttribute('data-id');
        const row=cb.closest('.fp-item-row');
        if(cb.checked){
          state.selectedIds[id]=true;
          if(!state.cfg[id]){
            const it=inv.find(x=>String(x.id)===String(id));
            state.cfg[id]={
              gramsPerUnit: it?parseGrams(it.name):'',
              daysPerUnit: ''
            };
            if(row){
              const gInp=row.querySelector('[data-role="fp-grams"]');
              const dInp=row.querySelector('[data-role="fp-days"]');
              if(gInp) gInp.value=state.cfg[id].gramsPerUnit;
              if(dInp) dInp.value=state.cfg[id].daysPerUnit;
              updateTotalHint(row,id);
            }
          }
        }else{
          delete state.selectedIds[id];
        }
        if(row) row.classList.toggle('checked', cb.checked);
        saveState();
        updateSelectCount();
      });
    });
    function updateTotalHint(row,id){
      const it=inv.find(x=>String(x.id)===String(id));
      if(!it) return;
      const unitLabel=it.specUnit||'罐';
      const units=remainingUnits(it);
      const hintEl=row.querySelector('.fp-item-total-hint');
      if(hintEl){
        const d=parseFloat(dInp?dInp.value:'');
        hintEl.textContent=totalHintText(units,unitLabel,dInp?dInp.value:'');
        hintEl.classList.toggle('warn', isNaN(d)||d<=0);
      }
    }
    function updateSelectCount(){
      const el=document.getElementById('fp-select-count');
      if(el) el.textContent='已選 '+Object.keys(state.selectedIds).length+' 項';
    }
    body.querySelectorAll('[data-role="fp-grams"]').forEach(inp=>{
      inp.addEventListener('input', function(){
        const id=inp.getAttribute('data-id');
        state.cfg[id]=state.cfg[id]||{};
        state.cfg[id].gramsPerUnit=inp.value===''?'':parseFloat(inp.value);
        saveState();
      });
    });
    body.querySelectorAll('[data-role="fp-days"]').forEach(inp=>{
      inp.addEventListener('input', function(){
        const id=inp.getAttribute('data-id');
        state.cfg[id]=state.cfg[id]||{};
        state.cfg[id].daysPerUnit=inp.value===''?'':parseFloat(inp.value);
        saveState();
        const row=inp.closest('.fp-item-row');
        if(row) updateTotalHint(row,id);
      });
    });
    const selToggleBtn=document.getElementById('fp-select-toggle');
    if(selToggleBtn) selToggleBtn.addEventListener('click', function(){
      if(allChecked){
        filtered.forEach(it=>{ delete state.selectedIds[it.id]; });
      }else{
        filtered.forEach(it=>{
          state.selectedIds[it.id]=true;
          if(!state.cfg[it.id]){
            state.cfg[it.id]={ gramsPerUnit: parseGrams(it.name), daysPerUnit:'' };
          }
        });
      }
      saveState();
      renderBody();
    });
    const cdInp=document.getElementById('fp-cooldown');
    if(cdInp) cdInp.addEventListener('input', function(){ state.cooldown=parseInt(cdInp.value||'0',10)||0; saveState(); });
    const sdInp=document.getElementById('fp-startdate');
    if(sdInp) sdInp.addEventListener('input', function(){ state.startDate=sdInp.value||todayStr(); saveState(); });
    const hzInp=document.getElementById('fp-horizon');
    if(hzInp) hzInp.addEventListener('input', function(){ state.horizonDays=Math.max(1,Math.min(730,parseInt(hzInp.value||'14',10)||14)); saveState(); });

    const genBtn=document.getElementById('fp-generate-btn');
    if(genBtn) genBtn.addEventListener('click', function(){ runGenerate(inv); });
    const viewResultBtn=document.getElementById('fp-view-result-btn');
    if(viewResultBtn) viewResultBtn.addEventListener('click', function(){ if(lastSchedule) renderResult(lastSchedule, lastTotalSupplyDays); });
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function totalHintText(units,unitLabel,daysPerUnit){
    const d=parseFloat(daysPerUnit);
    if(isNaN(d)||d<=0) return '目前庫存 '+units+unitLabel+'，請填「1'+unitLabel+'連續吃幾天」才能換算總天數';
    const blockLen=Math.max(1,Math.round(d));
    const total=units*blockLen;
    const roundNote = (blockLen!==d) ? '（天數會取整數 '+blockLen+' 天計算）' : '';
    return '= 目前庫存 '+units+unitLabel+'，每罐連續吃 '+blockLen+' 天'+roundNote+' = 總共約 '+total+' 天份';
  }
  function addDaysStr(dateStr,n){
    const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function weekdayLabel(dateStr){
    const wd=['日','一','二','三','四','五','六'][new Date(dateStr+'T00:00:00').getDay()];
    return '週'+wd;
  }

  function runGenerate(inv){
    const selected=Object.keys(state.selectedIds).map(id=>{
      const it=inv.find(x=>String(x.id)===String(id));
      if(!it) return null;
      const cfg=state.cfg[id]||{};
      const gramsPerUnit=parseFloat(cfg.gramsPerUnit);
      const daysPerUnitRaw=parseFloat(cfg.daysPerUnit);
      const units=remainingUnits(it);
      const blockLen=(!isNaN(daysPerUnitRaw)&&daysPerUnitRaw>0) ? Math.max(1,Math.round(daysPerUnitRaw)) : 0;
      return {id:String(id), name:it.name, grams:isNaN(gramsPerUnit)?0:gramsPerUnit, units, blockLen, expiry:it.expiry||''};
    }).filter(Boolean);

    const invalid=selected.filter(it=>!it.blockLen);
    const outOfStock=selected.filter(it=>it.blockLen && it.units<=0);
    if(outOfStock.length>0){
      alert('「'+outOfStock.map(x=>x.name).join('、')+'」已經沒有剩餘庫存了，麻煩取消勾選或先補貨。');
      return;
    }
    if(selected.length===0){
      alert('請至少勾選一項物資，並填寫「1罐連續吃幾天」喔！');
      return;
    }
    if(invalid.length>0){
      alert('「'+invalid.map(x=>x.name).join('、')+'」還沒填寫「1罐連續吃幾天」，請補上再產生菜單。');
      return;
    }
    const schedule=generateSchedule(selected, state.cooldown, state.startDate, state.horizonDays);
    const totalSupplyDays=selected.reduce((s,it)=>s+it.units*it.blockLen,0);
    lastSchedule=schedule;
    lastTotalSupplyDays=totalSupplyDays;
    ensureViewResultBtn();
    renderResult(schedule, totalSupplyDays);
  }

  // 產生成功後，若右側欄還沒有「查看上次產生的菜單」按鈕就動態補上，
  // 不用等使用者關掉頁籤、重新打開才會出現（這是原本的一個漏洞）。
  function ensureViewResultBtn(){
    if(document.getElementById('fp-view-result-btn')) return;
    const genBtn=document.getElementById('fp-generate-btn');
    if(!genBtn || !genBtn.parentElement) return;
    const row=document.createElement('div');
    row.id='fp-result-hint-row';
    row.innerHTML='<button type="button" id="fp-view-result-btn">📋 查看上次產生的菜單</button>';
    genBtn.insertAdjacentElement('afterend', row);
    document.getElementById('fp-view-result-btn').addEventListener('click', function(){
      if(lastSchedule) renderResult(lastSchedule, lastTotalSupplyDays);
    });
  }

  function weightedPick(items,weights){
    const total=weights.reduce((a,b)=>a+b,0);
    let r=Math.random()*total;
    for(let i=0;i<items.length;i++){ r-=weights[i]; if(r<=0) return items[i]; }
    return items[items.length-1];
  }

  // 排程邏輯：同一罐開封後會「連續吃完」整個 blockLen 天數才換下一罐，
  // 不會被拆成不連續的幾天（避免開封後放太久壞掉）。
  // remainingUnits：剩幾罐可用；lastEndDay：上一次吃這項物資「吃到的最後一天」（day index）。
  function generateSchedule(selected,cooldown,startDateStr,horizonDays){
    const stockLeft={}, lastEndDay={};
    selected.forEach(it=>{ stockLeft[it.id]=it.units; lastEndDay[it.id]=-Infinity; });
    const schedule=[];
    let day=0;
    let guard=0; // 安全閥，避免極端設定造成無窮迴圈
    while(day<horizonDays && guard++<horizonDays*4){
      const dateStr=addDaysStr(startDateStr,day);
      const eligible=function(it,ignoreCooldown){
        if(stockLeft[it.id]<=0) return false;
        if(!ignoreCooldown && (day-lastEndDay[it.id])<=cooldown) return false;
        const blockEndDate=addDaysStr(dateStr, Math.min(it.blockLen,horizonDays-day)-1);
        if(it.expiry && blockEndDate>it.expiry) return false;
        return true;
      };
      // 先找出「庫存還有、且這個時間點開始吃還來得及在過期前吃完」的全部候選（暫不管間隔限制）
      const feasible=selected.filter(it=>eligible(it,true));
      if(feasible.length===0){
        schedule.push({date:dateStr,item:null});
        day++;
        continue;
      }
      // 「寬裕天數」= 距離到期日還剩幾天，扣掉「把剩餘庫存吃完還需要幾天」。
      // 寬裕天數 <= 0 代表再不排它就會來不及在過期前吃完。
      const scored=feasible.map(it=>{
        const daysLeftToExpiry = it.expiry ? Math.round((new Date(it.expiry+'T00:00:00')-new Date(dateStr+'T00:00:00'))/86400000) : Infinity;
        const neededDays = stockLeft[it.id]*it.blockLen;
        return {it, slack: daysLeftToExpiry-neededDays};
      });
      // 一律優先從「沒在冷卻中」的品項裡挑最急迫的——即使某個品項很緊急，
      // 只要它還在自己的最少間隔天數限制內，就讓別的（沒在冷卻中的）品項先補上這個空檔，
      // 而不是為了它去違反間隔限制、把不那麼急的品項晾在一邊。
      // 唯有「所有品項當天都剛好在冷卻中」這種真的沒得選的情況，才不得已放寬間隔限制。
      const strictIds=new Set(selected.filter(it=>eligible(it,false)).map(it=>it.id));
      const strictScored=scored.filter(s=>strictIds.has(s.it.id));
      let pickFrom, relaxed;
      if(strictScored.length>0){ pickFrom=strictScored; relaxed=false; }
      else{ pickFrom=scored; relaxed=true; }
      // 在「這一輪實際可選」的品項裡，永遠選寬裕天數最小（最急迫）的那個，
      // 直到它的庫存用完或真的排不進去為止，不會被沒那麼急的品項插隊。
      // 只有在「急迫度完全相同」時（例如好幾項都沒設到期日），才用隨機決定順序。
      const minSlack = Math.min.apply(null, pickFrom.map(s=>s.slack));
      const topTier = pickFrom.filter(s=>s.slack===minSlack);
      const chosen = (topTier.length===1) ? topTier[0].it : weightedPick(topTier, topTier.map(()=>1)).it;
      const blockLen=Math.min(chosen.blockLen, horizonDays-day);
      stockLeft[chosen.id]--;
      const finished = stockLeft[chosen.id]<=0; // 這罐吃完後，這個品項就沒庫存了
      for(let k=0;k<blockLen;k++){
        schedule.push({date:addDaysStr(startDateStr,day+k),item:chosen,relaxed:relaxed,finished:finished && k===blockLen-1});
      }
      lastEndDay[chosen.id]=day+blockLen-1;
      day+=blockLen;
    }
    return schedule;
  }

  function ensureResultModal(){
    if(document.getElementById('fp-result-overlay')) return;
    const ov=document.createElement('div');
    ov.id='fp-result-overlay';
    ov.innerHTML =
      '<div id="fp-result-modal" role="dialog" aria-modal="true">'+
        '<div id="fp-result-head">'+
          '<h4>📋 產生的菜單</h4>'+
          '<button id="fp-result-close" type="button" aria-label="關閉">✕</button>'+
        '</div>'+
        '<div id="fp-result-scroll"></div>'+
      '</div>';
    document.body.appendChild(ov);
    ov.addEventListener('click', function(e){
      // 點擊背景遮罩會關閉視窗；現在「查看上次產生的菜單」按鈕已經修好，
      // 產生後會立刻出現，不怕手滑點到外面關掉後找不回上次的結果。
      if(e.target===ov){ closeResultModal(); return; }
      const toggleBtn=e.target.closest('.fp-hint-toggle');
      if(toggleBtn) toggleBtn.closest('.fp-hint-collapse').classList.toggle('open');
    });
    document.getElementById('fp-result-close').addEventListener('click', closeResultModal);
  }
  function openResultModal(){
    ensureResultModal();
    document.getElementById('fp-result-overlay').classList.add('open');
    // 每次開啟都從最上面開始看，不要記住上次滑到哪裡（尤其是換一種排法/重新產生時，
    // 內容已經不一樣了，還停在舊的捲動位置會很反直覺）。
    const scroll=document.getElementById('fp-result-scroll');
    if(scroll) scroll.scrollTop=0;
  }
  function closeResultModal(){
    const ov=document.getElementById('fp-result-overlay');
    if(ov) ov.classList.remove('open');
  }

  function collapsibleHint(icon, summary, detail){
    return '<div class="fp-hint-collapse">'+
      '<button type="button" class="fp-hint-toggle">'+icon+' '+summary+' <span class="fp-hint-caret">▸</span></button>'+
      '<p class="fp-hint fp-hint-detail">'+detail+'</p>'+
      '</div>';
  }

  function renderResult(schedule, totalSupplyDays){
    ensureResultModal();
    const scroll=document.getElementById('fp-result-scroll');
    if(!scroll) return;
    const horizonDays=schedule.length;
    const noneCount=schedule.filter(r=>!r.item).length;
    const relaxedCount=schedule.filter(r=>r.relaxed).length;
    const itemCount=new Set(schedule.filter(r=>r.item).map(r=>r.item.id)).size;
    let warnHtml='';
    if(noneCount>0){
      if(totalSupplyDays && totalSupplyDays<horizonDays){
        warnHtml+=collapsibleHint('ℹ️','有 '+noneCount+' 天沒有物資可排（物資量不夠，非排程出錯）',
          '你選的物資合計約有 '+totalSupplyDays+' 天份，但設定要排 '+horizonDays+' 天，所以有 '+noneCount+' 天沒有物資可排——這是正常現象，不是排程出錯，只是量不夠而已。可以多選幾樣物資，或把「要排幾天」設短一點。');
      }else{
        warnHtml+=collapsibleHint('⚠️','有 '+noneCount+' 天找不到符合條件的物資',
          '有 '+noneCount+' 天找不到符合條件（未過期、還有剩、間隔足夠）的物資，可能是選的物資到期日太集中，導致某幾天剛好卡住。');
      }
    }
    if(relaxedCount>0) warnHtml+=collapsibleHint('ℹ️','有 '+relaxedCount+' 天沒能符合「最少間隔幾天」（正常現象）',
      '有 '+relaxedCount+' 天沒能符合「最少間隔幾天」——通常是因為當時可以輪替的物資種類不夠多（例如快到期的排完後某段時間只剩一種可選，自然就沒辦法跟別的品項交錯），這是正常現象，不是排程出錯。想避免的話可以多選幾種物資增加輪替空間，或把「最少間隔幾天」設短一點。');
    if(warnHtml) warnHtml='<div id="fp-result-hints">'+warnHtml+'</div>';

    const rows=schedule.map(r=>{
      const dateChip='<div class="fp-r-date"><span class="fp-r-daynum">'+r.date.slice(5).replace('-','/')+'</span><span class="fp-r-weekday">'+weekdayLabel(r.date)+'</span></div>';
      if(!r.item){
        return '<div class="fp-r-row empty">'+dateChip+'<span class="fp-r-item none">😿 無適合品項</span></div>';
      }
      const gramsTxt = r.item.grams ? '<span class="fp-r-grams">'+r.item.grams+'g</span>' : '';
      const finishedBadge = r.finished ? '<span class="fp-r-finished-badge">✅ 這罐吃完</span>' : '';
      return '<div class="fp-r-row'+(r.finished?' finished':'')+'">'+dateChip+'<span class="fp-r-item">'+escapeHtml(r.item.name)+'</span><span class="fp-r-right">'+finishedBadge+gramsTxt+'</span></div>';
    }).join('');

    scroll.innerHTML =
      warnHtml+
      '<p id="fp-result-summary">共 '+horizonDays+' 天菜單・輪替 '+itemCount+' 種物資</p>'+
      '<div id="fp-result-list">'+rows+'</div>'+
      '<button type="button" id="fp-regen-btn">🔀 換一種排法</button>';
    const regenBtn=document.getElementById('fp-regen-btn');
    if(regenBtn) regenBtn.addEventListener('click', function(){
      const inv=loadInventory();
      runGenerate(inv);
    });
    openResultModal();
  }

  // ── 側邊欄插入「隨機配餐」按鈕：直接比照其他頁籤按鈕的原始 class，樣式才會完全一致 ──
  function initNavBtn(){
    const nav=document.querySelector('aside nav');
    if(!nav||nav.querySelector('#fp-nav-btn')) return;
    const btn=document.createElement('button');
    btn.id='fp-nav-btn';
    btn.type='button';
    btn.className=NAV_BTN_INACTIVE_CLASS;
    btn.textContent='🎲 隨機配餐';
    // 先關掉 transition 再插入，避免瀏覽器把「剛插入的新元素」誤判成一次樣式變化，
    // 播出一段沒必要的淡入/位移動畫（其他真正頁籤按鈕是頁面一開始就存在，不會有這個問題）。
    btn.style.transition='none';
    btn.addEventListener('click', openPanel);
    nav.appendChild(btn);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ btn.style.transition=''; });
    });
    watchRealTabClicks();
  }
  initNavBtn(); // 先立即嘗試一次
  // 這個 App 用 React.StrictMode + 開發版 build，瀏覽器載入當下 React 會把整個畫面
  // 「先掛載一次、卸載、再重新掛載一次」（StrictMode 開發模式的既定行為，抓副作用漏洞用，
  // 正式版不會這樣）。這代表我們插入的按鈕可能才剛出現就被那次卸載沖掉。
  // 所以這裡「永久」保持監聽、不能偵測到按鈕出現就斷線，否則按鈕被沖掉後就沒人補回來了。
  let navDebounce=null;
  const mo=new MutationObserver(function(){
    clearTimeout(navDebounce);
    navDebounce=setTimeout(initNavBtn,40);
  });
  mo.observe(document.body,{childList:true,subtree:true});
  // 額外加一個很短週期的輪詢，專門應付最開始那幾秒的掛載/卸載/重掛動盪期
  // （之後就交給上面的 MutationObserver 長期守著就好，輪詢本身會在幾秒後自動停止）。
  let navTries=0;
  const navTimer=setInterval(function(){
    initNavBtn();
    if(++navTries>150) clearInterval(navTimer);
  },20);
})();
</script>
<script>
// ══════════════════════════════════════════════════════════════
// 🔀 把「正在消耗／庫存囤貨／未結案物資／已結案／全部物資」5個選項
// 整合成標題旁邊「同一顆」下拉切換按鈕，不佔側邊欄空間。
// 側邊欄原本的 4 個狀態按鈕改成用 CSS 藏起來（邏輯完全不動、還在，
// 只是不顯示），下拉選單選到對應項目時用程式「點擊」那顆隱藏按鈕，
// 借用 App 原生邏輯切換畫面，安全性較高。
// ══════════════════════════════════════════════════════════════
(function(){
  'use strict';
  // 4 個狀態頁籤在 nav 裡固定的順序索引：0=正在消耗 1=庫存囤貨 2=已結案 3=全部物資
  const TAB_DEFS=[
    {idx:0, sidebarLabel:'📦 物資管理', menuLabel:'⏳ 正在消耗'}, // 側邊欄當入口顯示「物資管理」，下拉選單裡跟其他狀態並列時顯示「正在消耗」比較對齊語意
    {idx:1, sidebarLabel:'📦 庫存囤貨', menuLabel:'📦 庫存囤貨'},
    {idx:2, sidebarLabel:'✅ 已結案', menuLabel:'✅ 已結案'},
    {idx:3, sidebarLabel:'📋 全部物資', menuLabel:'📋 全部物資'}
  ];
  const HIDDEN_IDX=[1,2,3]; // 側邊欄只隱藏這 3 個，index 0（正在消耗/物資管理）留著當入口
  const OPTIONS=[
    {label:TAB_DEFS[0].menuLabel, idx:0}, // 正在消耗
    {label:TAB_DEFS[1].menuLabel, idx:1}, // 庫存囤貨
    {label:'🔀 未結案物資', combo:true},   // 消耗中+庫存（已結案的相反詞，語意更精準）
    {label:TAB_DEFS[2].menuLabel, idx:2}, // 已結案
    {label:TAB_DEFS[3].menuLabel, idx:3}  // 全部物資
  ];
  let filterOn=false; // 「未結案物資」濾鏡是否啟用中

  // 用「在 nav 裡的第幾個按鈕」取代用文字內容比對——因為我們要把第一個按鈕的
  // 顯示文字從「正在消耗」改成「物資管理」，如果還用文字比對會找不到自己。
  function getNavBtns(){
    const nav=document.querySelector('aside nav');
    if(!nav) return [];
    return Array.from(nav.querySelectorAll('button')).filter(function(b){
      return b.id!=='fp-nav-btn' && b.id!=='combo-select-chip';
    });
  }

  // 已結案卡片的狀態徽章文字固定是「✅ 已結案」，用文字比對找出卡片本體並藏起來，
  // 不動到卡片資料本身，只是視覺上濾掉。
  function applyDoneFilter(){
    document.querySelectorAll('span[class*="uppercase"][class*="tracking-wider"]').forEach(function(sp){
      if(sp.textContent.trim()==='✅ 已結案'){
        const card=sp.closest('[class*="rounded-3xl"]');
        if(card) card.style.display='none';
      }
    });
  }
  function clearDoneFilter(){
    document.querySelectorAll('[class*="rounded-3xl"]').forEach(function(card){
      if(card.style.display==='none') card.style.display='';
    });
  }

  function hideRealTabs(){
    const btns=getNavBtns();
    HIDDEN_IDX.forEach(function(i){ if(btns[i]) btns[i].style.display='none'; });
    // 把「正在消耗」的顯示文字改成「物資管理」（純視覺覆蓋，不動底層資料/狀態邏輯）。
    // React 每次重新渲染 nav 都會把文字改回原本的「正在消耗」，所以這裡要持續重貼。
    const usingBtn=btns[0];
    if(usingBtn && usingBtn.textContent.trim()!==TAB_DEFS[0].sidebarLabel){
      usingBtn.textContent=TAB_DEFS[0].sidebarLabel;
    }
  }

  function currentLabel(){
    if(filterOn) return '🔀 未結案物資';
    const btns=getNavBtns();
    const active=TAB_DEFS.find(function(d){
      return btns[d.idx] && btns[d.idx].className.indexOf('bg-primary')!==-1;
    });
    return active ? active.menuLabel : TAB_DEFS[0].menuLabel;
  }

  function selectOption(opt){
    closeDropdown();
    const btns=getNavBtns();
    if(opt.combo){
      const allBtn=btns[3]; // 全部物資
      if(!allBtn) return;
      allBtn.click();
      filterOn=true;
      setTimeout(applyDoneFilter,30);
      requestAnimationFrame(function(){ requestAnimationFrame(applyDoneFilter); });
    }else{
      filterOn=false;
      clearDoneFilter();
      const b=btns[opt.idx];
      if(b) b.click();
    }
    updateChipLabel();
  }

  function updateChipLabel(){
    const chip=document.getElementById('combo-select-chip');
    if(chip){
      const span=chip.querySelector('span');
      if(span) span.textContent=currentLabel();
    }
  }

  function closeDropdown(){
    const dd=document.getElementById('combo-select-dropdown');
    if(dd) dd.remove();
    const chip=document.getElementById('combo-select-chip');
    if(chip) chip.classList.remove('open');
  }

  function openDropdown(chip){
    closeDropdown();
    const dd=document.createElement('div');
    dd.id='combo-select-dropdown';
    const cur=currentLabel();
    dd.innerHTML=OPTIONS.map(function(o){
      return '<button type="button" class="combo-opt'+(o.label===cur?' cur':'')+'" data-label="'+o.label+'">'+o.label+'</button>';
    }).join('');
    document.body.appendChild(dd);
    const r=chip.getBoundingClientRect();
    dd.style.top=(r.bottom+window.scrollY+6)+'px';
    dd.style.left=(r.left+window.scrollX)+'px';
    dd.querySelectorAll('.combo-opt').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        const label=btn.getAttribute('data-label');
        const opt=OPTIONS.find(function(o){ return o.label===label; });
        if(opt) selectOption(opt);
      });
    });
    setTimeout(function(){
      document.addEventListener('click', onOutsideClick);
    },0);
  }
  function onOutsideClick(e){
    const dd=document.getElementById('combo-select-dropdown');
    const chip=document.getElementById('combo-select-chip');
    if(dd && !dd.contains(e.target) && chip && !chip.contains(e.target)){
      closeDropdown();
      document.removeEventListener('click', onOutsideClick);
    }
  }

  // 畫面重新渲染時（切換排序、搜尋等）持續重新套用濾鏡、確保小按鈕還在、標籤文字正確。
  // 加上 debounce：一次瞬間如果有一大串 DOM 異動（例如頁面剛載入、React 一口氣
  // 建立整個畫面），只在異動「安定下來」之後執行一次，不要每一筆異動都重新掃描一次
  // DOM，避免變成效能負擔（過去發現這種寫法在部分情況下會讓頁面載入變得很慢）。
  let debounceTimer=null;
  const mo=new MutationObserver(function(){
    clearTimeout(debounceTimer);
    debounceTimer=setTimeout(function(){
      if(filterOn) applyDoneFilter();
      hideRealTabs();
      initChip();
      updateChipLabel();
    },60);
  });
  mo.observe(document.body,{childList:true,subtree:true});

  // 小按鈕插進標題文字（<h2>）裡面，跟著「物資管理．XX」文字同一行顯示。
  // 「寵物資訊」「歷史比價牆」這兩個頁籤不需要這顆按鈕——但 React 切換頁籤時
  // 常常是「重複利用同一個 <h2> 元素、只換裡面的文字」，不會整個重新建立，
  // 所以我們插入的按鈕不會自動消失，必須主動偵測並移除，不能只是「不新增」。
  function initChip(){
    const h2=document.querySelector('main h2');
    const existing=document.getElementById('combo-select-chip');
    if(!h2){
      if(existing) existing.remove();
      return;
    }
    const t=h2.textContent;
    const shouldHide = t.indexOf('寵物資訊')!==-1 || t.indexOf('歷史比價牆')!==-1;
    if(shouldHide){
      if(existing) existing.remove();
      return;
    }
    if(existing) return; // 已經存在且該顯示，不用重建
    const chip=document.createElement('button');
    chip.id='combo-select-chip';
    chip.type='button';
    chip.style.transition='none';
    chip.innerHTML='<span>'+currentLabel()+'</span><b>▾</b>';
    chip.addEventListener('click', function(e){
      e.stopPropagation();
      const dd=document.getElementById('combo-select-dropdown');
      if(dd){ closeDropdown(); }else{ openDropdown(chip); chip.classList.add('open'); }
    });
    h2.appendChild(chip);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ chip.style.transition=''; });
    });
  }
  hideRealTabs();
  initChip();
  let tries=0;
  const timer=setInterval(function(){
    hideRealTabs();
    initChip();
    if(++tries>150) clearInterval(timer);
  },20);
})();
</script>

  font-size:13px;font-weight:800;padding:8px 12px;border-radius:12px;cursor:pointer;
  border:none;background:#f4f4f5;color:#18181b;margin-left:14px;
  display:inline-flex;align-items:center;gap:8px;transition:all .2s;vertical-align:middle;

<script>
// ===== 手機版收合側邊欄：漢堡按鈕開關 =====
(function(){
  'use strict';
  function initMobileNav(){
    const aside=document.querySelector('aside');
    if(!aside||aside._mnavInit) return;
    const logoRow=aside.querySelector('div.flex.items-center.gap-2.mb-2.select-none');
    const nav=aside.querySelector('nav');
    if(!logoRow||!nav) return;
    aside._mnavInit=true;

    const btn=document.createElement('button');
    btn.id='mnav-toggle-btn';
    btn.type='button';
    btn.setAttribute('aria-label','開啟選單');
    btn.textContent='☰';
    btn.style.cssText='margin-left:auto;background:rgba(255,255,255,.1);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;display:none;';
    logoRow.appendChild(btn);

    btn.addEventListener('click',function(){
      const open=aside.classList.toggle('mnav-open');
      btn.textContent=open?'✕':'☰';
      btn.setAttribute('aria-label',open?'關閉選單':'開啟選單');
    });
    // 點任何分類頁籤後自動收起選單（手機上點完就直接看內容）
    nav.addEventListener('click',function(e){
      if(e.target.closest('button')){
        aside.classList.remove('mnav-open');
        btn.textContent='☰';
      }
    });
  }
  let n=0;
  const t=setInterval(function(){
    initMobileNav();
    const aside=document.querySelector('aside');
    if((aside&&aside._mnavInit)||++n>60) clearInterval(t);
  },500);
})();
</script>

<script>
// ===== 有任何彈窗開啟時，自動隱藏日曆/里程碑懸浮按鈕，避免蓋住彈窗內容或按鈕 =====
(function(){
  'use strict';
  function hasOpenModal(){
    // 這個 App 裡所有全螢幕彈窗（新增/編輯物資、寵物資料、月份明細、
    // 照片放大、裁切頭貼、右鍵選單）都用 position:fixed + inset:0 的寫法；
    // 「讀取本地存檔」的匯入預覽視窗與「貓咪詳情面板」則各自有專屬 id。
    return !!(
      document.querySelector('.fixed.inset-0') ||
      document.getElementById('import-preview-overlay') ||
      document.querySelector('#pd-overlay.open') ||
      document.querySelector('#fp-result-overlay.open')
    );
  }
  function syncFabVisibility(){
    const zone=document.getElementById('cal-fab-zone');
    if(!zone) return;
    zone.style.display = hasOpenModal() ? 'none' : '';
  }
  const mo=new MutationObserver(syncFabVisibility);
  mo.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  syncFabVisibility();
  setInterval(syncFabVisibility,800); // 保險：涵蓋非DOM變動觸發的顯示/隱藏（如 class 切換動畫）
})();
</script>

<script>
// ===== PWA: 註冊 Service Worker（讓網頁可安裝、離線也能開） =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').then(function (reg) {
      // 每次開啟時檢查一下有沒有新版本
      reg.update();
      reg.addEventListener('updatefound', function () {
        var newWorker = reg.installing;
        if (!newWorker) return;
        newWorker.addEventListener('statechange', function () {
          if (newWorker.state === 'activated') {
            try {
              typeof window.showCatToast === 'function' &&
                window.showCatToast('已更新到最新版本，重新整理即可套用', 'success');
            } catch (e) {}
          }
        });
      });
    }).catch(function (err) {
      console.warn('[貓管家] Service Worker 註冊失敗:', err);
    });
  });
}
</script>
