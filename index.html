<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>貓管家</title>

    <!-- ===== PWA 設定 ===== -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="追蹤家裡開銷、開封壽命、保質期警戒與囤貨數量的貓咪物資管理小工具" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="貓管家" />
    <meta name="mobile-web-app-capable" content="yes" />
    <style>

      /* ===== Birthday Animation System ===== */

      /* Confetti pieces fall from top of card */
      @keyframes confetti-fall {
        0%   { transform: translateY(-8px) rotate(0deg) scale(1);   opacity: 1; }
        80%  { opacity: 1; }
        100% { transform: translateY(110px) rotate(720deg) scale(0.5); opacity: 0; }
      }
      @keyframes confetti-sway {
        0%,100% { margin-left: 0px; }
        25%      { margin-left: 8px; }
        75%      { margin-left: -8px; }
      }

      /* Card border rainbow glow pulse */
      @keyframes birthday-glow {
        0%,100% { box-shadow: 0 0 12px 2px rgba(236,72,153,0.35), 0 0 0 2px rgba(236,72,153,0.2); }
        33%     { box-shadow: 0 0 16px 4px rgba(250,204,21,0.45), 0 0 0 2px rgba(250,204,21,0.25); }
        66%     { box-shadow: 0 0 16px 4px rgba(139,92,246,0.45), 0 0 0 2px rgba(139,92,246,0.25); }
      }

      /* Cake emoji bounce */
      @keyframes cake-bounce {
        0%,100% { transform: translateY(0) scale(1); }
        40%     { transform: translateY(-6px) scale(1.2); }
        60%     { transform: translateY(-3px) scale(1.1); }
      }

      /* Shimmer sweep across card */
      @keyframes birthday-shimmer {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }

      .birthday-card {
        animation: birthday-glow 2.4s ease-in-out infinite !important;
        position: relative;
        overflow: visible !important;
      }

      .birthday-card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 28px;
        background: linear-gradient(105deg,
          transparent 40%,
          rgba(255,255,255,0.82) 50%,
          transparent 60%
        );
        background-size: 200% 100%;
        animation: birthday-shimmer 4s ease-in-out infinite;
        pointer-events: none;
        z-index: 1;
      }

      .birthday-confetti {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 0;
        overflow: visible;
        pointer-events: none;
        z-index: 20;
      }

      .birthday-confetti span {
        position: absolute;
        top: -6px;
        width: 8px; height: 11px;
        border-radius: 2px;
        display: block;
        animation: confetti-fall 2.8s ease-in infinite, confetti-sway 1.2s ease-in-out infinite;
      }
      .birthday-confetti span.cc1  { left:5%;  background:#f472b6; animation-delay:0s,    0s;    animation-duration:2.6s,1.1s; transform:rotate(15deg); }
      .birthday-confetti span.cc2  { left:15%; background:#facc15; animation-delay:0.5s,  0.2s;  animation-duration:3.0s,1.3s; transform:rotate(-20deg); }
      .birthday-confetti span.cc3  { left:25%; background:#818cf8; animation-delay:1.0s,  0.5s;  animation-duration:2.5s,1.0s; transform:rotate(30deg); }
      .birthday-confetti span.cc4  { left:35%; background:#34d399; animation-delay:0.3s,  0.7s;  animation-duration:2.9s,1.2s; transform:rotate(-10deg); }
      .birthday-confetti span.cc5  { left:45%; background:#fb923c; animation-delay:1.3s,  0.3s;  animation-duration:2.7s,0.9s; transform:rotate(25deg); }
      .birthday-confetti span.cc6  { left:55%; background:#e879f9; animation-delay:0.7s,  0.9s;  animation-duration:3.1s,1.1s; transform:rotate(-35deg); }
      .birthday-confetti span.cc7  { left:65%; background:#38bdf8; animation-delay:0.2s,  0.4s;  animation-duration:2.4s,1.4s; transform:rotate(18deg); }
      .birthday-confetti span.cc8  { left:75%; background:#f43f5e; animation-delay:0.9s,  0.1s;  animation-duration:2.8s,1.0s; transform:rotate(-22deg); }
      .birthday-confetti span.cc9  { left:85%; background:#a3e635; animation-delay:0.4s,  0.6s;  animation-duration:3.2s,0.8s; transform:rotate(40deg); }
      .birthday-confetti span.cc10 { left:93%; background:#fbbf24; animation-delay:1.1s,  0.3s;  animation-duration:2.6s,1.3s; transform:rotate(-15deg); }

      .birthday-cake-emoji {
        display: inline-block !important;
        animation: cake-bounce 1.0s ease-in-out infinite !important;
        transform-origin: center bottom;
        will-change: transform;
        font-size: 1.1em;
      }
      /* 1. Bouncy 2D rotation for PetCard age milestones star background */
      .pet-card-star {
        transform: rotate(12deg) scale(1) !important;
        transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      }
      .group:hover .pet-card-star {
        transform: rotate(102deg) scale(1.15) !important;
      }

      /* 2. Distinct hover background for Actual Purchase Amount chart bar */
      .actual-bar-hover {
        transition: background-color 0.15s ease-in-out !important;
      }
      .actual-bar-hover:hover {
        background-color: rgba(245, 158, 11, 0.15) !important; /* amber-500/15 in light mode */
      }
      .dark .actual-bar-hover:hover {
        background-color: rgba(245, 158, 11, 0.25) !important; /* amber-500/25 in dark mode */
      }
      /* === 消耗週期無縫跑馬燈 === */
      .cycle-scroll-wrap {
        overflow: hidden;
        max-width: 100%;
        position: relative;
      }
      .cycle-scroll-inner {
        display: inline-flex;
        white-space: nowrap;
        will-change: transform;
      }
      .cycle-scroll-inner .cycle-item {
        display: inline-block;
        white-space: nowrap;
      }
      @keyframes cycle-marquee {
        0%   { transform: translateX(0); }
        100% { transform: translateX(var(--scroll-dist, 0px)); }
      }
      .cycle-scroll-wrap:hover .cycle-scroll-inner.scrollable {
        animation: cycle-marquee 4.5s linear infinite;
      }

      /* === Pet cards grid: auto-fill with min 300px === */
      .pet-cards-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      /* === Wider screen card grid: 5 columns at >=1720px, 6 at >=2100px === */
      @media (min-width: 1720px) {
        .cat-cards-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
      }
      @media (min-width: 2100px) {
        .cat-cards-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      }

            /* === Import Preview Modal & Toast System === */

      /* Fix stacking context: ensure modal overlay renders above all transformed elements */
      #import-preview-overlay {
        isolation: isolate;
      }

      /* Toast notification */
      #cat-toast-container {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: center;
        pointer-events: none;
        width: max-content;
        max-width: calc(100vw - 40px);
      }
      .cat-toast {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        border-radius: 16px;
        font-weight: 800;
        font-size: 13.5px;
        letter-spacing: 0.01em;
        line-height: 1.4;
        box-shadow: 0 8px 32px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.10);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1.5px solid;
        animation: cat-toast-in 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        white-space: nowrap;
      }
      .cat-toast.success {
        background: rgba(16, 185, 129, 0.92);
        border-color: rgba(52, 211, 153, 0.5);
        color: #fff;
      }
      .cat-toast.error {
        background: rgba(239, 68, 68, 0.92);
        border-color: rgba(252, 165, 165, 0.5);
        color: #fff;
      }
      .cat-toast.removing {
        animation: cat-toast-out 0.3s ease-in forwards;
      }
      @keyframes cat-toast-in {
        from { opacity: 0; transform: translateY(16px) scale(0.95); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes cat-toast-out {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to   { opacity: 0; transform: translateY(8px) scale(0.96); }
      }

      /* Import preview modal entrance animation */
      .import-modal-card {
        animation: import-modal-in 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes import-modal-in {
        from { opacity: 0; transform: translateY(28px) scale(0.94); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }
    
      /* === cat tooltip CSS hover === */
      .cat-exp-badge { position: relative; }
      .cat-exp-badge:hover .cat-exp-tip { opacity: 1 !important; }
      .cat-cycle-badge { position: relative; }
      .cat-cycle-badge:hover .cat-cycle-tip { opacity: 1 !important; }
</style>

  <script>
  function showCatToast(message, type) {
    type = type || 'success';
    var container = document.getElementById('cat-toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'cat-toast-container';
      document.body.appendChild(container);
    }
    var toast = document.createElement('div');
    toast.className = 'cat-toast ' + type;
    toast.textContent = (type === 'success' ? '✅ ' : '❌ ') + message;
    container.appendChild(toast);
    setTimeout(function() {
      toast.classList.add('removing');
      setTimeout(function() { toast.remove(); }, 320);
    }, 3200);
  }
</script>

<style>
/* ===== Fix 1: Tooltip float above overflow:hidden card ===== */
.cat-tooltip-portal {
  position: fixed !important;
  z-index: 99999 !important;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.95);
  transition: opacity 0.15s ease, transform 0.15s ease;
}
.cat-tooltip-portal.cat-tooltip-visible {
  opacity: 1;
  transform: scale(1);
  pointer-events: auto;
}

/* ===== Fix 3: Marquee scroll for consumption cycle ===== */
@keyframes cat-marquee-scroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
.cat-marquee-outer {
  overflow: hidden;
  width: 100%;
  display: inline-block;
}
.cat-marquee-inner {
  display: inline-block;
  white-space: nowrap;
}
.cat-marquee-inner.scrolling {
  animation: cat-marquee-scroll 4s linear infinite;
}
</style>

<script>
(function() {
  'use strict';

  /* ============================================================
   * Fix 1: Tooltip – escape overflow:hidden via fixed portal
   * ============================================================
   * The tooltip sits inside a card with overflow:hidden.
   * We intercept hover on the trigger button and reposition
   * a cloned tooltip as a fixed-position portal appended to body.
   */
  function initTooltipPortal() {
    // Portal element lives in body to escape overflow:hidden
    var portal = document.createElement('div');
    portal.className = 'cat-tooltip-portal';
    portal.style.cssText = [
      'position:fixed',
      'z-index:99999',
      'pointer-events:none',
      'opacity:0',
      'transform:scale(0.95)',
      'transition:opacity 0.15s ease,transform 0.15s ease',
      'min-width:256px',
      'max-width:288px',
    ].join(';');
    document.body.appendChild(portal);

    // State flags
    var hideTimer     = null;
    var showTimer     = null;  // debounce rapid hover-in
    var activeBtn     = null;  // which button is currently "hovered"
    var portalReady   = false; // content fully injected

    function cancelTimers() {
      if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
      if (showTimer) { clearTimeout(showTimer); showTimer = null; }
    }

    function applyVisibleStyles(left, top) {
      portal.style.cssText = [
        'position:fixed',
        'z-index:99999',
        'pointer-events:auto',
        'opacity:1',
        'transform:scale(1)',
        'transition:opacity 0.15s ease,transform 0.15s ease',
        'min-width:256px',
        'max-width:288px',
        'padding:16px',
        'background:#09090b',
        'color:white',
        'border:1px solid #27272a',
        'border-radius:16px',
        'box-shadow:0 12px 30px rgba(0,0,0,0.5)',
        'font-size:12px',
        'font-weight:600',
        'line-height:1.6',
        'left:' + left + 'px',
        'top:' + top + 'px',
      ].join(';');
    }

    function calcPosition(triggerEl) {
      var rect = triggerEl.getBoundingClientRect();
      var w    = 280;
      var left = rect.right - w;
      if (left < 8) left = 8;
      var top  = rect.bottom + 8;
      if (top + 220 > window.innerHeight) top = rect.top - 8 - 220;
      return { left: left, top: top };
    }

    function showPortal(triggerEl, tooltipEl) {
      cancelTimers();
      activeBtn = triggerEl;

      // Debounce: wait one animation frame so layout is stable,
      // then inject content and show – prevents the "empty black box" race.
      showTimer = setTimeout(function() {
        if (activeBtn !== triggerEl) return; // mouse already left

        // Clone content fresh every time
        portal.innerHTML = '';
        var clone = tooltipEl.cloneNode(true);
        // Strip the original Tailwind opacity/scale/pointer classes so
        // cloned children don't interfere with our portal opacity.
        clone.removeAttribute('class');
        clone.style.cssText = 'display:block;width:100%;';
        portal.appendChild(clone);

        // Remove decorative arrow that points wrong direction in portal
        var arrow = portal.querySelector('.absolute.bottom-full');
        if (arrow) arrow.remove();

        // Force a synchronous layout pass so dimensions are known
        // before we call getBoundingClientRect on the trigger.
        void portal.offsetWidth;

        var pos = calcPosition(triggerEl);
        applyVisibleStyles(pos.left, pos.top);
        portalReady = true;
      }, 0); // 0 ms = next task, after any pending React re-renders
    }

    function hidePortal() {
      cancelTimers();
      activeBtn    = null;
      portalReady  = false;
      hideTimer = setTimeout(function() {
        portal.style.opacity        = '0';
        portal.style.transform      = 'scale(0.95)';
        portal.style.pointerEvents  = 'none';
        // Clear content after fade-out finishes
        setTimeout(function() {
          if (!portalReady) portal.innerHTML = '';
        }, 200);
      }, 80); // short grace period for mouse moving into portal
    }

    // Keep portal open when mouse moves into it
    portal.addEventListener('mouseenter', function() { cancelTimers(); });
    portal.addEventListener('mouseleave', function() { hidePortal(); });

    function attachTooltip(groupEl) {
      if (groupEl._catTooltipAttached) return;
      groupEl._catTooltipAttached = true;

      var btn = groupEl.querySelector('button');
      // Find tooltip div: has opacity-0 + z-[100] in className
      var tooltipDiv = null;
      var divs = groupEl.querySelectorAll('div');
      for (var i = 0; i < divs.length; i++) {
        var cls = divs[i].className || '';
        if (cls.includes('opacity-0') && cls.includes('z-[100]')) {
          tooltipDiv = divs[i];
          break;
        }
      }
      if (!tooltipDiv) {
        tooltipDiv = groupEl.querySelector('.absolute.right-0.top-full');
      }
      if (!btn || !tooltipDiv) return;

      // Hide the CSS-hover version so it can't flash on its own
      tooltipDiv.style.display = 'none';

      btn.addEventListener('mouseenter', function() {
        showPortal(btn, tooltipDiv);
      });
      btn.addEventListener('mouseleave', function(e) {
        // If cursor is moving into the portal, don't hide yet
        if (e.relatedTarget && portal.contains(e.relatedTarget)) return;
        hidePortal();
      });
      // Re-hide if user clicks outside
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
      });
    }

    // MutationObserver to handle elements mounted after initial render
    var scanScheduled = false;
    function scheduleScan() {
      if (scanScheduled) return;
      scanScheduled = true;
      requestAnimationFrame(function() {
        scanScheduled = false;
        document.querySelectorAll('[class*="group\\/tooltip"]').forEach(function(el) {
          attachTooltip(el);
        });
      });
    }

    var observer = new MutationObserver(scheduleScan);
    observer.observe(document.body, { childList: true, subtree: true });

    // Initial scan – run after React mounts
    requestAnimationFrame(function() {
      document.querySelectorAll('[class*="group\\/tooltip"]').forEach(function(el) {
        attachTooltip(el);
      });
    });
  }

  /* ============================================================
   * Fix 2: Image Upload Preview – center-based zoom/pan
   * ============================================================
   * The CropperOverlay component uses its own wheel handler.
   * We patch it by listening on the preview container and
   * overriding the transform with center-anchored zoom math.
   */
  function initCenterZoom() {
    function patchCropper(container) {
      if (container._catZoomPatched) return;
      container._catZoomPatched = true;

      // Find the inner draggable/pannable image div
      var img = container.querySelector('img');
      if (!img) return;

      var scale = 1;
      var translateX = 0;
      var translateY = 0;
      var isDragging = false;
      var lastX = 0;
      var lastY = 0;

      function applyTransform() {
        img.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')';
        img.style.transformOrigin = '0 0';
      }

      // Override wheel for center zoom
      container.addEventListener('wheel', function(e) {
        e.preventDefault();
        e.stopPropagation();

        var rect = container.getBoundingClientRect();
        // Mouse position relative to container center
        var cx = rect.width / 2;
        var cy = rect.height / 2;

        var delta = e.deltaY > 0 ? 0.9 : 1.1;
        var newScale = Math.min(Math.max(scale * delta, 0.5), 8);

        // Adjust translate to keep center stable
        translateX = cx - (cx - translateX) * (newScale / scale);
        translateY = cy - (cy - translateY) * (newScale / scale);
        scale = newScale;

        applyTransform();
      }, { passive: false, capture: true });

      // Mouse drag for panning
      container.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
        container.style.cursor = 'grabbing';
        e.stopPropagation();
      }, true);

      document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        translateX += e.clientX - lastX;
        translateY += e.clientY - lastY;
        lastX = e.clientX;
        lastY = e.clientY;
        applyTransform();
      });

      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          container.style.cursor = '';
        }
      });

      // Reset on double-click
      container.addEventListener('dblclick', function(e) {
        scale = 1; translateX = 0; translateY = 0;
        applyTransform();
        e.stopPropagation();
      }, true);

      applyTransform();
    }

    var observer = new MutationObserver(function() {
      // CropperOverlay renders a div with select-none and overflow-hidden
      // containing an img — find it
      document.querySelectorAll('[data-cropper-container], .cropper-container').forEach(patchCropper);

      // Fallback: find any modal-like div containing an img that has a wheel listener
      // Look for the drag/zoom area – it's typically an overflow-hidden div inside a modal
      document.querySelectorAll('div[class*="overflow-hidden"][class*="cursor"]').forEach(function(el) {
        if (el.querySelector('img') && !el._catZoomPatched) {
          // Check if it's in a dialog/modal context
          var isInDialog = el.closest('[role="dialog"]') || el.closest('[class*="modal"]') || el.closest('[class*="dialog"]') || el.closest('[class*="Dialog"]');
          if (isInDialog) {
            patchCropper(el);
          }
        }
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }

  /* ============================================================
   * Fix 3: Consumption Cycle marquee on hover in closed cards
   * ============================================================
   * In "已結案" (done) cards, the consumption cycle text (消耗週期)
   * may overflow. We add a hover-triggered marquee animation.
   */
  function initMarqueeScroll() {
    function attachMarquee(el) {
      if (el._catMarqueeAttached) return;
      var outer = document.createElement('span');
      outer.style.cssText = 'display:inline-block;overflow:hidden;max-width:100%;vertical-align:bottom;';
      var inner = document.createElement('span');
      inner.style.cssText = 'display:inline-block;white-space:nowrap;';
      inner.textContent = el.textContent;

      // Only activate if text overflows
      el.parentNode.insertBefore(outer, el);
      outer.appendChild(inner);
      el.style.display = 'none';
      el._catMarqueeAttached = true;

      // Check if text overflows after render
      requestAnimationFrame(function() {
        var containerWidth = outer.offsetWidth;
        var textWidth = inner.scrollWidth;
        if (textWidth <= containerWidth) return; // No overflow — no need

        // Duplicate text for seamless loop
        inner.textContent = el.textContent + '\u2003\u2003\u2003' + el.textContent;

        var animId = null;
        outer.addEventListener('mouseenter', function() {
          inner.style.animation = 'cat-marquee-scroll ' + Math.max(3, textWidth / 60) + 's linear infinite';
        });
        outer.addEventListener('mouseleave', function() {
          inner.style.animation = 'none';
          inner.style.transform = 'translateX(0)';
        });
      });
    }

    function scanCards() {
      // Find done-status cards: look for spans containing "已結案" status badge
      // then find sibling text containing day count patterns
      // Strategy: find text nodes containing "天/天數" or numeric patterns
      // The consumption cycle label is "消耗週期" and value has "天" or "次"

      document.querySelectorAll('[class*="text-xs"][class*="font-black"]').forEach(function(el) {
        var txt = el.textContent || '';
        // Look for spans that contain digits followed by "天" that may overflow
        if (/\d+.*天/.test(txt) && el.offsetWidth > 0) {
          var isInDoneCard = false;
          var card = el.closest('[class*="rounded"]');
          if (card) {
            var statusBadge = card.querySelector('[class*="bg-gray-100"]');
            if (statusBadge && statusBadge.textContent.includes('已結案')) {
              isInDoneCard = true;
            }
          }
          if (isInDoneCard && !el._catMarqueeAttached) {
            attachMarquee(el);
          }
        }
      });

      // Also scan for any span sibling to "消耗週期" label text
      document.querySelectorAll('span, p').forEach(function(el) {
        if (!el._catMarqueeAttached && el.childNodes.length === 1 && el.childNodes[0].nodeType === 3) {
          var txt = (el.textContent || '').trim();
          // Pattern: "X 天 (YYYY-MM-DD ~ YYYY-MM-DD)" or "XX 天"
          if (/^\d+\s*天/.test(txt) && txt.length > 10) {
            var card = el.closest('[class*="rounded"]');
            if (card) {
              var statusBadge = card.querySelector('[class*="bg-gray-100"]');
              if (statusBadge && statusBadge.textContent && statusBadge.textContent.includes('已結案')) {
                attachMarquee(el);
              }
            }
          }
        }
      });
    }

    var observer = new MutationObserver(function() {
      setTimeout(scanCards, 100);
    });
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(scanCards, 500);
  }

  /* Boot everything once DOM is ready */
  function boot() {
    try { initTooltipPortal(); } catch(e) { console.warn('[cat-patch] tooltip:', e); }
    try { initCenterZoom(); } catch(e) { console.warn('[cat-patch] zoom:', e); }
    try { initMarqueeScroll(); } catch(e) { console.warn('[cat-patch] marquee:', e); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>


<div id="cat-global-tip" style="position:fixed;display:none;background:#18181b;color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.25);z-index:99999;pointer-events:none;white-space:nowrap;transition:opacity 0.15s;"></div>
<script>
(function(){
  var tip = document.getElementById('cat-global-tip');
  document.addEventListener('mouseover', function(e){
    var el = e.target.closest('[data-exp-days]');
    if(el && el.dataset.expDays !== ''){
      tip.textContent = '距今還有 ' + el.dataset.expDays + ' 天到期';
      tip.style.display = 'block'; tip.style.opacity = '1'; return;
    }
    var el2 = e.target.closest('[data-cycle-range]');
    if(el2 && el2.dataset.cycleRange){
      tip.textContent = el2.dataset.cycleRange;
      tip.style.display = 'block'; tip.style.opacity = '1';
    }
  });
  document.addEventListener('mouseout', function(e){
    var el = e.target.closest('[data-exp-days],[data-cycle-range]');
    if(el){ tip.style.display = 'none'; }
  });
  document.addEventListener('mousemove', function(e){
    if(tip.style.display === 'block'){
      tip.style.left = (e.clientX + 12) + 'px';
      tip.style.top = (e.clientY - 36) + 'px';
    }
  });
})();
</script>

<script>
(function(){
'use strict';
const WK='cat_weight_v1',PK='cat_pets_v1',AK='cat_adopt_v1';
const loadW=()=>{try{return JSON.parse(localStorage.getItem(WK)||'{}')}catch{return{}}};
const saveW=d=>{try{localStorage.setItem(WK,JSON.stringify(d))}catch{}};
const loadPets=()=>{try{return JSON.parse(localStorage.getItem(PK)||'[]')}catch{return[]}};
const loadA=()=>{try{return JSON.parse(localStorage.getItem(AK)||'{}')}catch{return{}}};
const saveA=d=>{try{localStorage.setItem(AK,JSON.stringify(d))}catch{}};

let W={},A={},pet=null,tab='weight';
let _scrollPos={weight:0,ms:0};
let _syncTimer=null;
let _tabDir='right',_animateNext=false;
const _tabOrder=['weight','ms'];

const MS=[
  {d:1,e:'🐾',n:'第一天相遇'},{d:7,e:'🌟',n:'一週了！'},
  {d:30,e:'🎉',n:'一個月紀念'},{d:100,e:'💯',n:'100 天里程碑'},
  {d:180,e:'🌸',n:'半年紀念日'},{d:365,e:'🎂',n:'一週年快樂'},
  {d:500,e:'✨',n:'500 天在一起'},{d:730,e:'🏆',n:'兩週年！'},
  {d:1000,e:'👑',n:'1000 天王者'},{d:1461,e:'💎',n:'四週年鑽石紀念'},
  {d:2000,e:'🌈',n:'2000 天彩虹旅程'},{d:3650,e:'🦁',n:'十週年傳奇'},
];
const COLORS=['c0','c1','c2','c3','c4','c5'];

function dSince(s){if(!s)return 0;const b=new Date(s),t=new Date();b.setHours(0,0,0,0);t.setHours(0,0,0,0);return Math.max(0,Math.floor((t-b)/86400000)+1);}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function ageAtStr(b,atDate){
  if(!b)return '';
  const bd=new Date(b),t=atDate?new Date(atDate):new Date();
  bd.setHours(0,0,0,0);t.setHours(0,0,0,0);
  if(bd>t)return '';
  let y=t.getFullYear()-bd.getFullYear(),m=t.getMonth()-bd.getMonth(),d=t.getDate()-bd.getDate();
  if(d<0){m--;d+=new Date(t.getFullYear(),t.getMonth(),0).getDate();}
  if(m<0){y--;m+=12;}
  if(y===0&&m===0)return d+' 天大';
  if(y===0)return m+' 個月大';
  return y+' 歲'+(m>0?m+' 個月':'')+'大';
}
function ageInMonths(b){
  if(!b)return null;
  const bd=new Date(b),t=new Date();
  bd.setHours(0,0,0,0);t.setHours(0,0,0,0);
  if(bd>t)return null;
  let y=t.getFullYear()-bd.getFullYear(),m=t.getMonth()-bd.getMonth();
  if(t.getDate()<bd.getDate())m--;
  if(m<0){y--;m+=12;}
  return y*12+m;
}

/* ── chart ── */
let _chartPts=[], _chartSW=360, _chartPT=10, _chartCh=108;
let _chartRange='all'; // '3m' | '6m' | 'all'

function buildChart(pid,showAge){
  const allEnts=[...(W[pid]||[])].sort((a,b)=>a.date.localeCompare(b.date));
  _chartPts=[];
  // filter by range
  let ents=allEnts;
  if(_chartRange!=='all'){
    const months=_chartRange==='3m'?3:6;
    const cutoff=new Date();cutoff.setMonth(cutoff.getMonth()-months);
    const cutStr=cutoff.toISOString().slice(0,10);
    ents=allEnts.filter(e=>e.date>=cutStr);
    if(ents.length<2) ents=allEnts; // fallback to all if not enough data
  }
  if(ents.length<2)return`<div class="pd-chart-box" style="display:flex;align-items:center;justify-content:center;height:150px;font-size:12px;color:#c4b5fd">📊 至少 2 筆才顯示圖表</div>`;
  const SW=480,H=132,PL=34,PR=10,PT=10,PB=22,cw=SW-PL-PR,ch=H-PT-PB;
  _chartSW=SW;_chartPT=PT;_chartCh=ch;
  const kgs=ents.map(e=>parseFloat(e.kg));
  const lo=Math.min(...kgs),hi=Math.max(...kgs),rng=hi-lo||.2,pad=rng*.18;
  const yDec=rng<1?2:1;
  const klo=lo-pad,krng=(hi+pad)-klo,n=ents.length;
  const pts=ents.map((e,i)=>({x:PL+(n===1?cw/2:cw*i/(n-1)),y:PT+ch-ch*((parseFloat(e.kg)-klo)/krng),kg:e.kg,date:e.date,age:showAge?ageAtStr(pet.birthday,e.date):''}));
  _chartPts=pts;
  function spl(ps){
    if(ps.length<2)return'';
    let d=`M${ps[0].x.toFixed(1)},${ps[0].y.toFixed(1)}`;
    for(let i=0;i<ps.length-1;i++){
      const p0=ps[Math.max(0,i-1)],p1=ps[i],p2=ps[i+1],p3=ps[Math.min(ps.length-1,i+2)],t=.28;
      const ax=p1.x+t*(p2.x-p0.x)/2,ay=p1.y+t*(p2.y-p0.y)/2;
      const bx=p2.x-t*(p3.x-p1.x)/2,by=p2.y-t*(p3.y-p1.y)/2;
      d+=` C${ax.toFixed(1)},${ay.toFixed(1)} ${bx.toFixed(1)},${by.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    }return d;
  }
  const line=spl(pts),area=line+` L${pts[n-1].x.toFixed(1)},${(PT+ch).toFixed(1)} L${PL},${(PT+ch).toFixed(1)} Z`;
  const gid='g'+Math.random().toString(36).slice(2,7);
  const step=Math.max(1,Math.ceil(n/5)),xIdx=new Set([0,n-1]);
  for(let i=step;i<n-1;i+=step)xIdx.add(i);
  const yTk=v=>{const y=PT+ch-ch*((v-klo)/krng);return`<text x="${PL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#c4b5fd" font-weight="700">${v.toFixed(yDec)}</text><line x1="${PL}" y1="${y.toFixed(1)}" x2="${(PL+cw).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e9d5ff" stroke-width="1" stroke-dasharray="3,3" opacity=".5"/>`;};
  const yTks=[lo,(lo+hi)/2,hi].map(yTk).join('');
  const xLbls=[...xIdx].sort((a,b)=>a-b).map(i=>`<text x="${pts[i].x.toFixed(1)}" y="${(PT+ch+14).toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#a78bfa" font-weight="600">${ents[i].date.slice(5)}</text>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${i===n-1?4:2.5}" fill="${i===n-1?'#6d28d9':'#a78bfa'}" stroke="#fff" stroke-width="1.5"/>`).join('');
  const lp=pts[n-1],lx=Math.min(lp.x+7,PL+cw-26),ly=lp.y>PT+16?lp.y-7:lp.y+15;
  return`<div class="pd-chart-box"><svg id="pd-chart-svg" viewBox="0 0 ${SW} ${H}" xmlns="http://www.w3.org/2000/svg" style="cursor:crosshair;display:block">
  <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".25"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".02"/></linearGradient></defs>
  ${yTks}
  <path d="${area}" fill="url(#${gid})"/>
  <path d="${line}" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <line id="pd-vline" x1="0" y1="${PT}" x2="0" y2="${PT+ch}" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4,3" opacity=".8" style="display:none"/>
  <circle id="pd-vdot" r="5.5" fill="#6d28d9" stroke="#fff" stroke-width="2.5" style="display:none"/>
  ${dots}
  <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="9.5" fill="#6d28d9" font-weight="900">${lp.kg}kg</text>

const tip=document.getElementById('pd-tip');
function bindTip(){
  const svg=document.getElementById('pd-chart-svg');
  if(!svg||!_chartPts.length)return;
  const vl=document.getElementById('pd-vline');
  const vd=document.getElementById('pd-vdot');
  svg.addEventListener('mousemove',function(e){
    const r=svg.getBoundingClientRect();
    const mx=(e.clientX-r.left)*(_chartSW/r.width);
    let best=_chartPts[0],bd=Infinity;
    _chartPts.forEach(p=>{const d=Math.abs(p.x-mx);if(d<bd){bd=d;best=p;}});
    vl.setAttribute('x1',best.x.toFixed(1));vl.setAttribute('x2',best.x.toFixed(1));
    vl.setAttribute('y1',_chartPT);vl.setAttribute('y2',_chartPT+_chartCh);
    vl.style.display='';
    vd.setAttribute('cx',best.x.toFixed(1));vd.setAttribute('cy',best.y.toFixed(1));
    vd.style.display='';
    tip.textContent=best.age?`${best.date} · ${best.kg} kg · ${best.age}`:`${best.date} · ${best.kg} kg`;
    tip.classList.add('on');
    tip.style.left=(e.clientX+14)+'px';
    tip.style.top=(e.clientY-36)+'px';
  });
  svg.addEventListener('mouseleave',function(){
    if(vl)vl.style.display='none';
    if(vd)vd.style.display='none';
    tip.classList.remove('on');
  });
}

/* ── weight tab ── */
function renderWeight(editingDate=null){
  const body=document.getElementById('pd-body'),pid=String(pet.id);
  // sorted newest first for display
  const ents=[...(W[pid]||[])].sort((a,b)=>b.date.localeCompare(a.date));
  const today=new Date().toISOString().slice(0,10);
  // 未滿 2 歲（還在發育）才在 tooltip 顯示當下月齡，成貓體重變化不大就不用了
  const totalAgeM=ageInMonths(pet.birthday);
  const showAgeCol=totalAgeM!=null&&totalAgeM<24;

  // stats (using ascending for first/last)
  const asc=[...(W[pid]||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const latest=asc.length?parseFloat(asc[asc.length-1].kg):null;
  const prev2=asc.length>=2?parseFloat(asc[asc.length-2].kg):null;
  const diff=latest!=null&&prev2!=null?latest-prev2:null;
  const allKgs=asc.map(e=>parseFloat(e.kg));
  const maxKg=allKgs.length?Math.max(...allKgs):null;

  // 近一個月變化：找 30 天前最接近的那筆
  const oneMonthAgo=new Date();oneMonthAgo.setDate(oneMonthAgo.getDate()-30);
  const omaStr=oneMonthAgo.toISOString().slice(0,10);
  const oldEntries=asc.filter(e=>e.date<=omaStr);
  const monthBase=oldEntries.length?parseFloat(oldEntries[oldEntries.length-1].kg):null;
  const monthChange=latest!=null&&monthBase!=null?latest-monthBase:null;
  const monthBaseDate=oldEntries.length?oldEntries[oldEntries.length-1].date:null;

  const diffStr=diff!=null?(diff>0?`▲ +${diff.toFixed(2)}`:(diff<0?`▼ ${diff.toFixed(2)}`:'持平')):null;
  const monthStr=monthChange!=null?(monthChange>=0?`▲ +${monthChange.toFixed(2)}`:`▼ ${monthChange.toFixed(2)}`):null;
  const mcColor=monthChange!=null?(monthChange>0?'rose':monthChange<0?'emerald':'amber'):'amber';

  const statsHtml=`<div class="pd-w-stats">
    <div class="pd-w-stat violet">
      <div class="pd-w-stat-label">目前體重</div>
      <div class="pd-w-stat-val">${latest!=null?latest.toFixed(2):'—'}<span style="font-size:11px;font-weight:700;opacity:.6"> kg</span></div>
      ${diffStr?`<div class="pd-w-stat-sub">${diffStr} kg（上次）</div>`:''}
    </div>
    <div class="pd-w-stat rose">
      <div class="pd-w-stat-label">歷史最重</div>
      <div class="pd-w-stat-val">${maxKg!=null?maxKg.toFixed(2):'—'}<span style="font-size:11px;font-weight:700;opacity:.6"> kg</span></div>

  }
}

    const animCls=_animateNext?(_tabDir==='left'?' pd-anim-left':' pd-anim-right'):'';
  _animateNext=false;
  body.innerHTML=`<div class="pd-tab-content${animCls}">${nextBar}<div class="pd-slabel" style="margin-top:4px">里程碑清單</div><div class="pd-ms-list">${rows}</div></div>`;

/* ── card intercept (pet only: rounded-[28px]) ── */
let allowEdit=false;

function isPetCard(el){return(el.className||'').includes('rounded-[28px]');}

function findPetCard(el){
  let n=el;
  while(n&&n!==document.body){
    if(n.parentElement&&n.parentElement.classList.contains('pet-cards-grid')){
      return isPetCard(n)?n:null;
    }
    n=n.parentElement;
  }
  return null;
}

// Match a DOM card to a pet by extracting the name text from the card
function petFromCard(card){
  const pets=loadPets();
  // Walk every text node / element to find one matching a pet name
  const allText=card.textContent||'';
  // Try each pet name — longest match first to avoid substring false positives
  const sorted=[...pets].sort((a,b)=>(b.name||'').length-(a.name||'').length);
  for(const p of sorted){
    if(p.name&&p.name!=='未命名'&&allText.includes(p.name.trim())) return p;
  }
  // Fallback: position index among pet cards
  const grid=document.querySelector('.pet-cards-grid');
  if(!grid)return null;
  const petCards=[...grid.children].filter(c=>isPetCard(c));
  const idx=petCards.indexOf(card);
  return idx>=0&&idx<pets.length?pets[idx]:null;
}

document.addEventListener('click',function(e){
  if(allowEdit)return;
  if(overlay.classList.contains('open'))return;
  const card=findPetCard(e.target);
  if(!card)return;
  if(e.target.closest('button')||e.target.closest('a'))return;
  // Let avatar click through — it has stopPropagation + zoom handler
  if(e.target.closest('[class*="group/avatar"]')||e.target.closest('[class*="cursor-pointer"][class*="rounded-full"]'))return;
  if(e.target.closest('[data-chip-copy]'))return;
  const matched=petFromCard(card);
  if(!matched)return;
  e.stopPropagation();e.preventDefault();
  openPanel(matched);
},true);

   隱藏「年齡里程碑」裡純天數顯示（如「216 天」）

══════════════════════════════════════════════ */
(function patchAgeDays(){
  function cleanAgeText(){
    document.querySelectorAll('.pet-cards-grid > *').forEach(card=>{
      // Fix age text (strip trailing " X 天" when year/month present, or hide if pure days)
      const ageEl=card.querySelector('[class*="text-[15px]"][class*="font-extrabold"]');
      if(ageEl){
        const txt=ageEl.textContent||'';
        // Only hide when it's purely "X 天" with no year or month
        // (those days are already shown in "出生至今：X 天" below)
        // All other combinations (X 歲, X 個月, X 歲 X 個月 X 天, etc.) stay intact
        if(!txt.includes('歲')&&!txt.includes('個月')&&/^\d+\s*天$/.test(txt.trim())){
          ageEl.style.display='none';
        } else {
          ageEl.style.display=''; // restore if previously hidden
        }
      }

      // 標籤已直接在原始碼修正為「出生至今：」，此處不再需要 DOM 文字置換
    });
  }

  let debounce;
  const obs=new MutationObserver(()=>{clearTimeout(debounce);debounce=setTimeout(cleanAgeText,200);});
  obs.observe(document.body,{childList:true,subtree:true});
  setTimeout(cleanAgeText,1000);
})();
(function patchBackup(){
  const WK='cat_weight_v1', AK='cat_adopt_v1', SK='cat_personal_links_v1';
  const loadW=()=>{try{return JSON.parse(localStorage.getItem(WK)||'{}')}catch{return{}}};
  const loadA=()=>{try{return JSON.parse(localStorage.getItem(AK)||'{}')}catch{return{}}};
  const loadS=()=>{try{return JSON.parse(localStorage.getItem(SK)||'{}')}catch{return{}}};

  /* ── EXPORT: intercept button in capture phase, build enhanced JSON ── */
  function patchExport(){
    const btn=[...document.querySelectorAll('button')].find(b=>b.textContent.includes('匯出備份'));
    if(!btn||btn._wPatched)return;
    btn._wPatched=true;
    btn.addEventListener('click',function(e){
      e.stopImmediatePropagation();
      e.preventDefault();
      try{
        // 優先使用記憶體中最新的 React 狀態（含剛更新但可能因儲存空間不足
        // 而尚未成功寫入 localStorage 的頭貼變更），避免匯出到舊資料。
        const db=window.__catDb||JSON.parse(localStorage.getItem('cat_v12_5')||'[]');
        const pets=window.__catPets||JSON.parse(localStorage.getItem('cat_pets_v1')||'[]');
        const payload={
          db, pets,
          version:'12.8',
          exportAt:new Date().toISOString(),
          weightData:loadW(),
          adoptData:loadA(),
          personalLinks:loadS()
        };
        const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;
        a.download=`貓管家備份_${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);a.click();
        document.body.removeChild(a);URL.revokeObjectURL(url);
      }catch(err){
        console.warn('[貓管家] 匯出失敗',err);
      }
    },true);// capture phase — fires before React's handler
  }

  /* ── IMPORT: listen on same file input, restore weight & adopt data ── */
  function patchImport(){
    const input=document.getElementById('savefile-loader');
    if(!input||input._wPatched)return;
    input._wPatched=true;
    input.addEventListener('change',function(e){
      const file=e.target.files&&e.target.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=function(ev){
        try{
          const data=JSON.parse(ev.target.result);
          // Silently restore — React's own toast already covers the success message
          if(data.weightData&&typeof data.weightData==='object'){
            localStorage.setItem(WK,JSON.stringify(data.weightData));
          }
          if(data.adoptData&&typeof data.adoptData==='object'){
            localStorage.setItem(AK,JSON.stringify(data.adoptData));
          }
          if(data.personalLinks&&typeof data.personalLinks==='object'){
            localStorage.setItem(SK,JSON.stringify(data.personalLinks));
            window.dispatchEvent(new CustomEvent('cat-settings-updated'));
          }
        }catch{}
      };
      reader.readAsText(file);
    });// non-capture, runs alongside React's handler
  }

  // Poll until React mounts the buttons (up to 30s)
  let n=0;
  const t=setInterval(()=>{
    patchExport();patchImport();
    if(++n>60)clearInterval(t);
  },500);
})();
</script>

<script>
/* ── 罐頭類庫存總覽（罐=罐頭／包=餐包；肉泥已改歸類到「點心」分類，不在此追蹤）── */
(function catCannedStockWidget(){
  const DB_KEY='cat_v12_5';
  const UNIT_MAP={'罐':{label:'🥫 罐頭','order':0},'包':{label:'🍱 餐包','order':1}};

  function loadDB(){
    try{ return JSON.parse(localStorage.getItem(DB_KEY)||'[]'); }catch{ return []; }
  }

  function computeStock(db){
    const today=new Date(); today.setHours(0,0,0,0);
    const groups={'罐':0,'包':0};
    (db||[]).forEach(it=>{
      if(!it || it.category!=='罐頭') return;
      if(!(it.specUnit in groups)) return; // 只認「罐／包／入」三種規格單位
      let remain=0;
      if(it.status==='done'){
        remain=0;
      }else if(it.status==='warehouse'){
        remain=Number(it.specVal)||0; // 未拆封：整包規格數全算庫存
      }else if(it.status==='using'){
        if(it.mode==='count'){
          const total=Number(it.total)||0;
          const used=(it.logs||[]).length;
          remain=Math.max(0,total-used);
        }else{
          // day 模式：依已過天數估算剩餘比例換算成剩餘罐/包/入數
          const specVal=Number(it.specVal)||0;
          const est=Number(it.est)||30;
          if(it.start){
            const start=new Date(it.start); start.setHours(0,0,0,0);
            const elapsed=Math.round((today-start)/864e5);
            const frac=Math.max(0,Math.min(1,(est-elapsed)/est));
            remain=Math.round(specVal*frac);
          }else{
            remain=specVal;
          }
        }
      }
      groups[it.specUnit]+=Math.max(0,remain);
    });
    return groups;
  }

  function buildHTML(groups){
    const rows=Object.keys(UNIT_MAP).sort((a,b)=>UNIT_MAP[a].order-UNIT_MAP[b].order).map(u=>{
      const info=UNIT_MAP[u];
      return '<div style="display:flex;justify-content:space-between;align-items:center;background:#27272a;border-radius:12px;padding:8px 12px;">'
        + '<span style="font-size:12px;font-weight:800;color:#e4e4e7;">'+info.label+'</span>'
        + '<span style="font-family:ui-monospace,monospace;font-weight:900;font-size:13px;color:#c4b5fd;">'+groups[u]+' '+u+'</span>'
        + '</div>';
    }).join('');
    const settings=(window._catLoadSettings&&window._catLoadSettings())||{};
    const sheetLink=settings.sheetUrl
      ? '<a href="'+settings.sheetUrl.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:9px;padding:0 4px;font-size:10.5px;font-weight:700;color:#52525b;text-decoration:none;">📊 適口性試算表<span style="opacity:.6;">↗</span></a>'
      : '<button id="inv-sheet-setup-btn" style="display:flex;align-items:center;gap:4px;justify-content:flex-end;width:100%;margin-top:9px;padding:0 4px;font-size:10.5px;font-weight:700;color:#52525b;background:none;border:none;cursor:pointer;">📊 尚未設定試算表<span style="opacity:.6;">⚙️</span></button>';
    return '<h5 style="font-size:10px;font-weight:900;letter-spacing:.08em;color:#71717a;text-transform:uppercase;padding:0 4px;margin-bottom:10px;">🥫 罐頭類庫存總覽</h5>'
      + '<div style="display:flex;flex-direction:column;gap:6px;">'+rows+'</div>'
      + sheetLink;
  }

  function render(){
    const aside=document.querySelector('aside');
    if(!aside) return;
    const groups=computeStock(loadDB());
    let box=document.getElementById('inv-stock-widget');
    if(!box){
      box=document.createElement('div');
      box.id='inv-stock-widget';
      box.style.cssText='margin-top:24px;padding-top:20px;border-top:1px solid #27272a;opacity:0;transform:translateY(8px);transition:opacity .4s ease,transform .4s ease;';
      const heading=[...aside.querySelectorAll('h5')].find(h=>h.textContent.indexOf('本機存檔工具')!==-1);
      if(heading && heading.parentElement && heading.parentElement.parentElement===aside){
        aside.insertBefore(box, heading.parentElement);
      }else{
        aside.appendChild(box);
      }
      box.innerHTML=buildHTML(groups);
      // 先插入（維持透明），下一個畫面更新週期再淡入，才會是平滑出現而不是資料一抓到就瞬間閃現
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          box.style.opacity='1';
          box.style.transform='translateY(0)';
        });
      });
    }else{
      box.innerHTML=buildHTML(groups);
    }
    const setupBtn=document.getElementById('inv-sheet-setup-btn');
    if(setupBtn) setupBtn.onclick=function(){ if(window._catOpenSettings) window._catOpenSettings(); };
  }

  setInterval(render,1000);
  window.addEventListener('storage',render);
  window.addEventListener('cat-settings-updated',render);
  setTimeout(render,800);
})();
</script>

<script>
/* ── 陪伴里程碑主動提醒（滿版彈窗 + 懸浮重開按鈕）── */
(function catMilestoneAlert(){
  const PK='cat_pets_v1', AK='cat_adopt_v1';
  const MS=[
    {d:1,e:'🐾',n:'第一天相遇',msg:'陪伴您第一天了！'},
    {d:7,e:'🌟',n:'一週了！',msg:'陪伴您一週了！'},
    {d:30,e:'🎉',n:'一個月紀念',msg:'陪伴您一個月了！'},
    {d:100,e:'💯',n:'100 天里程碑',msg:'陪伴您100天了！'},
    {d:180,e:'🌸',n:'半年紀念日',msg:'陪伴您半年了！'},
    {d:365,e:'🎂',n:'一週年快樂',msg:'陪伴您一週年了！'},
    {d:500,e:'✨',n:'500 天在一起',msg:'陪伴您500天了！'},
    {d:730,e:'🏆',n:'兩週年！',msg:'陪伴您兩週年了！'},
    {d:1000,e:'👑',n:'1000 天王者',msg:'陪伴您1000天了！'},
    {d:1461,e:'💎',n:'四週年鑽石紀念',msg:'陪伴您四週年了！'},
    {d:2000,e:'🌈',n:'2000 天彩虹旅程',msg:'陪伴您2000天了！'},
    {d:3650,e:'🦁',n:'十週年傳奇',msg:'陪伴您十週年了！'},
  ];
  function dSince(s){
    if(!s) return 0;
    const b=new Date(s), t=new Date();
    b.setHours(0,0,0,0); t.setHours(0,0,0,0);
    return Math.max(0,Math.floor((t-b)/86400000)+1);
  }
  function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}'); }catch{ return {}; } }
  function loadPets(){ try{ return JSON.parse(localStorage.getItem(PK)||'[]'); }catch{ return []; } }

  function birthdayAlert(p, today){
    if(!p.birthday) return null;
    const b=new Date(p.birthday);
    if(b.getMonth()===today.getMonth() && b.getDate()===today.getDate()){
      const age=today.getFullYear()-b.getFullYear();
      if(age>=1) return age;
    }
    return null;
  }

  function monthAgeAlert(p, today){
    if(!p.birthday) return null;
    const b=new Date(p.birthday); b.setHours(0,0,0,0);
    for(let n=1;n<=11;n++){
      const target=new Date(b.getFullYear(), b.getMonth()+n, b.getDate());
      target.setHours(0,0,0,0);
      if(target.getTime()===today.getTime()) return n;
    }
    return null;
  }

  function computeAlerts(){
    const pets=loadPets(), adopt=loadJSON(AK);
    const today=new Date(); today.setHours(0,0,0,0);
    const alerts=[];
    pets.forEach(p=>{
      const adoptDate=adopt[String(p.id)]||p.birthday||'';
      if(adoptDate){
        const days=dSince(adoptDate);
        MS.forEach(m=>{
          if(m.d===days){
            alerts.push({name:p.name,photo:p.photo,tag:`${m.e} ${m.msg}`,cls:'ms-today',priority:3});
          }
        });
      }
      const age=birthdayAlert(p, today);
      if(age!==null){
        alerts.push({name:p.name,photo:p.photo,tag:`🎂 ${age}歲生日快樂！`,cls:'ms-today',priority:4});
      }
      const mAge=monthAgeAlert(p, today);
      if(mAge!==null){
        alerts.push({name:p.name,photo:p.photo,tag:`🐣 滿${mAge}個月大了！`,cls:'ms-today',priority:3});
      }
    });
    alerts.sort((a,b)=>b.priority-a.priority);
    return alerts;
  }

  function buildListHTML(alerts){
    return alerts.slice(0,8).map(a=>
      '<div class="ms-modal-item">'
        +'<div class="ms-modal-avatar">'+(a.photo?'<img src="'+a.photo+'" alt="">':(a.name?a.name.charAt(0):'🐱'))+'</div>'

      +'</div>'
    ).join('');

    const ov=document.createElement('div');

    ov.className='ms-modal-overlay';
    ov.innerHTML=
      '<div class="ms-modal-card">'
        +'<div class="ms-modal-head">'
          +'<button class="ms-modal-close" title="關閉">✕</button>'
          +'<span class="ms-confetti" style="left:12%;top:18%;animation:msFloat1 2.6s ease-in-out infinite">🎉</span>'
          +'<span class="ms-confetti" style="right:13%;top:14%;font-size:13px;animation:msFloat2 3.1s ease-in-out infinite .3s">✨</span>'
          +'<span class="ms-confetti" style="right:20%;top:62%;font-size:14px;animation:msFloat3 2.8s ease-in-out infinite .6s">⭐</span>'
          +'<span class="ms-confetti" style="left:19%;top:60%;font-size:14px;animation:msFloat2 3s ease-in-out infinite .15s">🎊</span>'
          +'<div class="ms-modal-badge-wrap">'

            +'<span class="ms-badge-ring"></span>'
            +'<div class="ms-modal-badge">🏆</div>'
          +'</div>'
        +'</div>'
        +'<div class="ms-modal-body">'
          +'<div class="ms-modal-eyebrow">✨ 特別時刻</div>'
          +'<div class="ms-modal-title">陪伴里程碑提醒</div>'
          +'<div class="ms-modal-sub">今天是主子的特別日子！</div>'
          +'<div class="ms-modal-divider"></div>'
          +'<div class="ms-modal-list">'+buildListHTML(alerts)+'</div>'
          +'<div class="ms-modal-foot"><button class="ms-modal-ok"><span>知道了</span><span>🎈</span></button></div>'
        +'</div>'
      +'</div>';
    document.body.appendChild(ov);
    ov.querySelector('.ms-modal-close').onclick=closeModal;
    ov.querySelector('.ms-modal-ok').onclick=closeModal;
    ov.onclick=e=>{ if(e.target===ov) closeModal(); };
  }

  function showFab(){
    if(document.getElementById('ms-fab')) return;
    const alerts=computeAlerts();
    if(alerts.length===0) return;
    const fab=document.createElement('button');
    fab.id='ms-fab';
    fab.className='ms-fab';
    fab.title='陪伴里程碑提醒';
    fab.innerHTML='🏆<span class="ms-fab-badge">'+Math.min(alerts.length,9)+'</span>';
    fab.onclick=()=>{ removeFab(); showModal(computeAlerts()); };
    const zone=document.getElementById('cal-fab-zone');
    (zone||document.body).appendChild(fab);
  }
  function removeFab(){
    const f=document.getElementById('ms-fab');
    if(f) f.remove();
  }

  setTimeout(()=>{
    const alerts=computeAlerts();
    if(alerts.length>0) showModal(alerts);

})();
</script>

<script>
(function(){
  'use strict';
  const SETTINGS_KEY='cat_personal_links_v1';
  function loadSettings(){ try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}'); }catch{ return {}; } }
  function saveSettings(s){ try{ localStorage.setItem(SETTINGS_KEY,JSON.stringify(s)); }catch{} }
  window._catLoadSettings=loadSettings; // 讓其他腳本(側欄試算表小工具)也能讀取

  const fab=document.getElementById('cal-fab');
  const overlay=document.getElementById('cal-overlay');
  const iframe=document.getElementById('cal-iframe');
  const emptyState=document.getElementById('cal-empty-state');
  const settingsOverlay=document.getElementById('settings-overlay');
  const calInput=document.getElementById('settings-cal-input');
  const sheetInput=document.getElementById('settings-sheet-input');

  function openCal(){
    const s=loadSettings();
    if(s.calUrl){
      iframe.src=s.calUrl+(s.calUrl.includes('?')?'&':'?')+'_t='+Date.now();
      iframe.style.display='block';
      emptyState.style.display='none';
    }else{
      iframe.style.display='none';
      emptyState.style.display='flex';
    }
    overlay.classList.add('open');
  }
  function closeCal(){ overlay.classList.remove('open'); }
  fab.onclick=openCal;
  document.getElementById('cal-refresh-btn').onclick=function(){
    const s=loadSettings();
    if(s.calUrl) iframe.src=s.calUrl+(s.calUrl.includes('?')?'&':'?')+'_t='+Date.now();
  };
  document.getElementById('cal-close-btn').onclick=closeCal;
  overlay.onclick=function(e){ if(e.target===overlay) closeCal(); };
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){
      if(settingsOverlay.classList.contains('open')){ e.stopImmediatePropagation(); closeSettings(); }
      else if(overlay.classList.contains('open')){ closeCal(); }
    }
  });

  /* ── settings modal ── */
  function openSettings(){
    const s=loadSettings();
    calInput.value=s.calUrl||'';
    sheetInput.value=s.sheetUrl||'';
    settingsOverlay.classList.add('open');
  }
  function closeSettings(){ settingsOverlay.classList.remove('open'); }
  window._catOpenSettings=openSettings;
  document.getElementById('cal-settings-btn').onclick=openSettings;
  document.getElementById('cal-empty-settings-btn').onclick=openSettings;
  document.getElementById('settings-close-btn').onclick=closeSettings;
  settingsOverlay.onclick=function(e){ if(e.target===settingsOverlay) closeSettings(); };
  document.getElementById('settings-save-btn').onclick=function(){
    saveSettings({calUrl:calInput.value.trim(),sheetUrl:sheetInput.value.trim()});
    closeSettings();
    if(overlay.classList.contains('open')) openCal(); // 若日曆視窗開著，立即套用新設定
    window.dispatchEvent(new CustomEvent('cat-settings-updated'));
  };
  document.getElementById('settings-clear-btn').onclick=function(){
    if(!confirm('確定要清除已儲存的日曆／試算表網址嗎？'))return;
    saveSettings({});
    calInput.value='';sheetInput.value='';
    window.dispatchEvent(new CustomEvent('cat-settings-updated'));
  };
})();
</script>

.fp-r-item.none{color:#dc2626;font-weight:600;}
